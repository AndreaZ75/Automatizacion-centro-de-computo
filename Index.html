<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laboratorios de cómputo · Instituto Tecnológico de Matehuala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>


:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#1F2733; --muted:#4F5B6C; --line:#D3DCEA;
  --gold:#1B396A; --gold-fill:#1B396A; --on-gold:#FFFFFF; --rose:#EAF0F9; --rose-strong:#C5D3EA;
  --carbon:#1B396A; --on-carbon:#FFFFFF;
  --ok:#1F7A3D; --ok-bg:#E6F3EA; --warn:#7A5000; --warn-bg:#FFF1D6; --bad:#B42318; --bad-bg:#FDECEA;
  --shadow:0 18px 50px rgba(58,58,64,.18);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1623; --surface:#18212F; --ink:#EEF2F8; --muted:#A9B4C6; --line:#2B3850;
    --gold:#8FB1F0; --gold-fill:#2F5597; --on-gold:#FFFFFF; --rose:#1E2B42; --rose-strong:#34476A;
    --carbon:#8FB1F0; --on-carbon:#0F1623;
    --ok:#6FCB92; --ok-bg:#1B3325; --warn:#F0C36A; --warn-bg:#3A2F14; --bad:#FF9A90; --bad-bg:#3D1F1C;
    --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1623; --surface:#18212F; --ink:#EEF2F8; --muted:#A9B4C6; --line:#2B3850;
  --gold:#8FB1F0; --gold-fill:#2F5597; --on-gold:#FFFFFF; --rose:#1E2B42; --rose-strong:#34476A;
  --carbon:#8FB1F0; --on-carbon:#0F1623;
  --ok:#6FCB92; --ok-bg:#1B3325; --warn:#F0C36A; --warn-bg:#3A2F14; --bad:#FF9A90; --bad-bg:#3D1F1C;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;
  background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
header.top{padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--carbon);color:var(--on-carbon);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px;flex:none;border-bottom:3px solid var(--gold-fill)}
.brandrow h1{font-size:18px;margin:0;line-height:1.1}
.brandrow small{display:block;color:var(--muted);font-size:13px}
.spacer{flex:1}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metarow select{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:14px;background:var(--rose);border:1px solid var(--line);color:var(--ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:700}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:700}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent;font-weight:700}
.chip.gray{background:var(--bg);color:var(--muted)}
main{flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start;-webkit-overflow-scrolling:touch}
h2{font-size:22px;margin:0}
h3{font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:grid;gap:10px}
.card.rose{background:var(--rose)}
label{display:grid;gap:5px;font-weight:700;font-size:16px}
label span.hint{font-weight:400;color:var(--muted);font-size:15px}
input,select,textarea{width:100%;min-height:46px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--carbon);background:var(--surface);cursor:pointer;font-weight:700}
.btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:8px 12px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{border-radius:12px;padding:11px 13px;font-size:16px;display:grid;gap:3px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:var(--warn-bg);color:var(--warn)}
.msg b{font-weight:700}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.item .title{font-weight:700;font-size:18px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.slot b{font-size:19px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.kpi span{color:var(--muted);font-size:15px}
.bar{height:12px;border-radius:6px;background:var(--rose);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-fill)}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tblwrap table{min-width:max-content}
.tblwrap th,.tblwrap td{white-space:nowrap;padding:8px 10px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:700;font-size:14px}
details{border:1px solid var(--line);border-radius:14px;padding:4px 14px;background:var(--rose)}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details ol{margin:4px 0 12px;padding-left:20px;display:grid;gap:6px}
nav.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 8px}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;min-height:56px;border-radius:12px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700;padding:4px 2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--gold);background:var(--rose)}
nav.tabs button[aria-current="page"] svg{stroke:var(--gold)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;align-items:end;justify-items:center;z-index:50;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:430px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.hist{display:grid;gap:6px;font-size:15px;color:var(--muted)}
ul.plain{margin:0;padding-left:20px;display:grid;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:520px){ .overlay{padding:0} }
@media (prefers-reduced-motion:no-preference){ .msg{animation:pop .18s ease-out} @keyframes pop{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}} }
.login{display:grid;gap:14px;align-content:center;min-height:100%}
.login .hero{display:grid;gap:8px;justify-items:start}
.login .logo{width:56px;height:56px;font-size:20px;border-radius:14px}
.codeinput{font-size:28px;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--gold);font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{color:var(--muted);padding:24px 0;text-align:center}
#app.busy::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--gold-fill);animation:bar 1s linear infinite}
@keyframes bar{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
#app{position:relative}
.slot.busy{background:var(--rose)}
.slot.past{opacity:.55}
@media (max-width:520px){
  body{padding:0}
  #app{max-width:none;height:100dvh;border-radius:0;border:0;box-shadow:none}
}

/* encabezado: nunca debe salirse de la pantalla, el botón Salir siempre visible */
.top{min-width:0;overflow:hidden}
.brandrow{min-width:0}
.brandrow>div:nth-child(2){min-width:0}
.brandrow h1,.brandrow small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metarow{min-width:0;max-width:100%}
.chip.who{max-width:100%;min-width:0}
.who span{min-width:0;max-width:100%}
.outbtn{flex:0 0 auto;width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;font:inherit;font-weight:700;font-size:15px;color:var(--ink)}

h1,h2,h3,.kpi b{font-family:Montserrat,var(--font)}
.mark{height:42px;width:auto;flex:none;background:#fff;border-radius:8px;padding:3px;border:1px solid var(--line)}
.brandrow h1{font-size:15px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brandrow small{font-size:12.5px}
.login .marks{display:flex;gap:12px;align-items:center}
.login .mark{height:76px;padding:6px;border-radius:12px}
.login h2{font-size:21px;line-height:1.2}
.pie{text-align:center;color:var(--muted);font-size:13px;line-height:1.35;padding-top:6px}

/* ===== Diseño institucional ===== */
:root{--navy-d:#142B52;--navy-m:#2A559B;--sky:#7FA6E8;--shadow-s:0 1px 2px rgba(20,43,82,.06),0 8px 20px rgba(20,43,82,.07)}
body{background:radial-gradient(1200px 500px at 50% -10%,#DDE7F6 0,var(--bg) 60%)}
header.top{background:linear-gradient(135deg,var(--navy-d) 0%,#1B396A 55%,var(--navy-m) 100%);color:#fff;border:0;padding:14px 16px 16px;position:relative;box-shadow:0 6px 18px rgba(20,43,82,.25);z-index:2}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--sky),#D3E2FA,var(--sky))}
header.top .brandrow h1{color:#fff}
header.top .brandrow small{color:#C9D8F2}
header.top .mark{border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header.top .chip.who{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
header.top .outbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.32);color:#fff}
main{background:transparent}
h2{font-size:21px;letter-spacing:-.2px;margin:4px 0 2px;color:var(--ink)}
h3{font-size:16px;margin:14px 0 6px;color:var(--ink)}
.hola{margin:2px 0 0;color:var(--muted);font-size:15px}
.hola b{color:var(--gold)}
.fecha{margin:-4px 0 2px;color:var(--gold);font-weight:700;font-size:15px}
.card,.item,.slot,.kpi,.seg{border-radius:18px;box-shadow:var(--shadow-s);border-color:transparent}
.card.hl{background:linear-gradient(180deg,var(--rose),var(--surface))}
.btn{border-radius:14px;transition:transform .12s ease,box-shadow .2s ease,filter .2s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--navy-m),#1B396A);border-color:transparent;color:#fff;box-shadow:0 6px 14px rgba(27,57,106,.28)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--surface)}
.chip.blue{background:var(--rose);color:var(--gold);font-weight:700;border-color:transparent}
.slot.free{border-left:5px solid var(--ok);padding-left:12px}
.slot.free b{font-family:Montserrat,var(--font);font-size:18px;color:var(--ink)}
.seg{display:grid;gap:6px;padding:12px 12px 12px 14px;background:var(--surface);border-left:5px solid var(--line);position:relative}
.seg.libre{border-left-color:var(--ok);grid-template-columns:1fr auto;align-items:center}
.seg.res{border-left-color:var(--gold-fill)}
.seg.res.used{border-left-color:var(--ok)}
.seg.past{opacity:.55}
.seg b{font-family:Montserrat,var(--font);font-size:17px}
.item .when{font-size:16px}
.item .when b{font-family:Montserrat,var(--font)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-top:4px solid var(--navy-m);padding:12px}
.kpi.k2{border-top-color:var(--ok)}.kpi.k3{border-top-color:#C98A00}.kpi.k4{border-top-color:var(--bad)}
.kpi b{font-size:26px;line-height:1.1;color:var(--ink)}
.bar{height:12px;background:var(--rose)}
.bar i{background:linear-gradient(90deg,var(--navy-m),var(--sky));border-radius:6px;transition:width .6s ease}
.empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;background:var(--surface)}
.empty svg{width:34px;height:34px;color:var(--navy-m);opacity:.8}
.empty b{color:var(--ink)}
.empty span{font-size:15px}
nav.tabs{box-shadow:0 -8px 22px rgba(20,43,82,.09);border-top:0;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
nav.tabs button{border-radius:14px;transition:background .2s ease,color .2s ease}
nav.tabs button[aria-current="page"]{background:linear-gradient(180deg,var(--rose),var(--rose-strong));color:var(--gold);font-weight:700}
.overlay{backdrop-filter:blur(3px)}
.sheet{border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(20,43,82,.3);animation:sheetin .25s ease both}
@keyframes sheetin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
/* acceso */
#app.is-login #top{display:none}
#app.is-login main{padding:0;background:var(--bg)}
.loginwrap{display:flex;flex-direction:column;min-height:100%}
.lhero{background:linear-gradient(160deg,var(--navy-d),#1B396A 55%,var(--navy-m));color:#fff;padding:34px 22px 64px;border-radius:0 0 34px 34px;position:relative;overflow:hidden;display:grid;gap:10px;justify-items:start}
.lhero::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(127,166,232,.45),transparent 70%)}
.lhero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.lhero>*{position:relative;z-index:1}
.lhero .marks{display:flex;gap:12px;align-items:center}
.lhero .mark{height:78px;padding:7px;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.28);border:0}
.lhero h2{color:#fff;font-size:24px;line-height:1.18;margin:10px 0 0}
.lhero p{margin:0;color:#C9D8F2;font-size:15px}
.lbody{padding:0 16px 18px;margin-top:-40px;display:grid;gap:12px;position:relative;z-index:2}
.lcard{padding:18px;box-shadow:0 14px 34px rgba(20,43,82,.2)}
.check{display:flex;align-items:center;gap:10px;font-weight:400}
.check input{width:24px;min-height:24px;height:24px}
.ayuda{margin:0;text-align:center}
.pie{text-align:center;color:var(--muted);font-size:13px;line-height:1.4;margin:6px 0 0}
/* carga y movimiento */
.sk{height:68px;border-radius:18px;background:linear-gradient(90deg,var(--rose),var(--surface),var(--rose));background-size:200% 100%;animation:sh 1.2s linear infinite;margin-bottom:10px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
main>*{animation:rise .3s ease both}
.list>*{animation:rise .3s ease both}
.list>*:nth-child(2){animation-delay:.04s}.list>*:nth-child(3){animation-delay:.08s}.list>*:nth-child(4){animation-delay:.12s}.list>*:nth-child(5){animation-delay:.16s}.list>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:var(--bg)}}

<div id="app" role="application" aria-label="Laboratorios de cómputo">
  <header class="top" id="top"></header>
  <main id="main" tabindex="-1" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Navegación principal" hidden></nav>
</div>
<div id="modal"></div>
<script>

/* ---------- utilidades ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return (n<10?"0":"")+n}
function dmy(s){return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4)}
function hm(s){return s.slice(11,16)}
function today(){return S.ahora?S.ahora.slice(0,10):""}
function longDate(d){try{var t=new Date(d+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});return t.charAt(0).toUpperCase()+t.slice(1)}catch(e){return dmy(d)}}
function toMin(s){return +s.slice(11,13)*60+ +s.slice(14,16)}
function mmStr(date,m){return date+" "+pad(Math.floor(m/60))+":"+pad(m%60)}
function durLabel(d){var h=Math.floor(d/60),m=d%60;return (h===1&&!m)?"1 hora":m?h+" h "+m+" min":h+" horas"}
function durOptions(list,sel){return list.map(function(d){return '<option value="'+d/60+'"'+(+sel===d/60?" selected":"")+'>'+durLabel(d)+'</option>'}).join("")}
function tol(){return S.params.tolerancia_min||15}
function busyOf(oc){return oc.map(function(o){return [toMin(o.ini),toMin(o.fin)]})}
function isFree(busy,a,b){return !busy.some(function(x){return x[0]<b&&x[1]>a})}
function startOk(date,m){return !(date===today()&&m+tol()<=toMin(S.ahora))}
function startList(date,oc){var busy=busyOf(oc),o=[];for(var m=420;m+60<=1230;m+=30){if(startOk(date,m)&&isFree(busy,m,m+60))o.push(m)}return o}
function durList(date,oc,m){var busy=busyOf(oc),mx=(S.params.duracion_max_h||3)*60,o=[],d;
  if(m==null||isNaN(m)){for(d=60;d<=mx;d+=30)o.push(d);return o}
  for(d=60;d<=mx&&m+d<=1230&&isFree(busy,m,m+d);d+=30)o.push(d);return o}
function freeWindows(date,oc){var busy=busyOf(oc).sort(function(a,b){return a[0]-b[0]}),out=[],cur=420;
  function push(a,b){if(date===today()){while(a+tol()<=toMin(S.ahora))a+=30}if(b-a>=60)out.push([a,b])}
  busy.forEach(function(x){if(x[0]>cur)push(cur,x[0]);cur=Math.max(cur,x[1])});if(cur<1230)push(cur,1230);return out}
function lab(id){return S.labs.filter(function(l){return l.id===id})[0]||{id:id,nombre:id,capacidad:0,equipos:[]}}
function chip(s){var c={"Reservada":"blue","Usada":"ok","Cancelada":"bad","No usada":"warn","Abierto":"bad","En revisión":"warn","Resuelto":"ok","Libre":"ok"}[s]||"gray";return '<span class="chip '+c+'">'+esc(s)+'</span>'}
function flashHtml(){if(!S.flash)return "";var f=S.flash;S.flash=null;return '<div class="msg '+f.t+'" role="status">'+f.h+'</div>'}
function setFlash(t,h){S.flash={t:t,h:h}}
function mailLine(c){return c?'Te enviamos un correo a '+esc(c)+'.':''}
function labOptions(sel,ph,all){var h=ph?'<option value="">'+ph+'</option>':'';if(all)h+='<option value="todos"'+(sel==="todos"?" selected":"")+'>Todos los laboratorios</option>';return h+S.labs.map(function(l){return '<option value="'+l.id+'"'+(sel===l.id?" selected":"")+'>'+esc(l.nombre)+'</option>'}).join("")}
function empty(ic,t,p){return '<div class="empty">'+icon(ic)+'<b>'+t+'</b>'+(p?'<span>'+p+'</span>':'')+'</div>'}
function hola(){return '<p class="hola">Hola, <b>'+esc(S.user.nombre.split(" ")[0])+'</b></p>'}
function fechaLbl(d){return '<p class="fecha">'+esc(longDate(d))+'</p>'}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ---------- comunicación con el servidor ---------- */
function api(accion,datos){
  S.busy=true;$("app").classList.add("busy");
  return new Promise(function(res){
    function fin(r){S.busy=false;$("app").classList.remove("busy");
      if(r&&r.ahora)S.ahora=r.ahora;
      if(r&&r.sesion){S.token=null;store("bep-token",null);S.user=null;S.login={correo:""};setFlash("info","<b>Tu sesión terminó.</b><span>Vuelve a entrar con tu correo.</span>");draw();return}
      res(r||{ok:false,msg:"No hubo respuesta del servidor."})}
    if(!window.google||!google.script||!google.script.run){fin({ok:false,msg:"Esta página debe abrirse desde el enlace de la aplicación."});return}
    google.script.run.withSuccessHandler(fin).withFailureHandler(function(){fin({ok:false,msg:"No hay conexión con el servidor. Revisa tu internet e intenta de nuevo."})}).llamar(S.token,accion,datos||{});
  });
}

var SKEL='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
function draw(soft){
  drawTop();
  $("app").classList.toggle("is-login",!S.user);
  if(!S.user){$("tabs").hidden=true;$("tabs").innerHTML="";$("main").innerHTML=viewLogin();return}
  var nv=NAVS[S.user.rol];
  if(!S.tab||!nv.some(function(n){return n[0]===S.tab}))S.tab=nv[0][0];
  $("tabs").hidden=nv.length<2;
  $("tabs").innerHTML=nv.map(function(n){return '<button data-go="'+n[0]+'"'+(n[0]===S.tab?' aria-current="page"':'')+'>'+icon(n[2])+'<span>'+n[1]+'</span></button>'}).join("");
  if(!soft)$("main").innerHTML=SKEL;
  var tab=S.tab,fid=document.activeElement&&document.activeElement.id,top=$("main").scrollTop;
  VIEWS[tab]().then(function(h){if(S.tab!==tab||!S.user)return;$("main").innerHTML=h;if(soft){$("main").scrollTop=top;var el=fid&&$(fid);if(el&&el.focus)try{el.focus({preventScroll:true})}catch(e){}}renderModal()});
}

  var h='<h2>Entrada y salida</h2><p class="muted">Registra cuándo entras al laboratorio y cuándo sales. Sustituye la bitácora de papel.</p>'+flashHtml();
  h+='<form id="fent" class="card" novalidate><label>Reserva<select id="ef" name="folio" data-act="entsel"><option value="">Elige tu reserva</option>'+o.reservas.map(function(r){return '<option value="'+r.folio+'"'+(r.folio===S.entFolio?" selected":"")+'>'+r.folio+' · '+esc(r.labNombre)+' · '+hm(r.inicio)+' a '+hm(r.fin)+(r.deDocente?' (de tu docente)':'')+'</option>'}).join("")+'</select></label>';
  h+='<label>Equipo<select name="equipo" id="eq"><option value="">Elige tu computadora</option>'+(cur?lab(cur.lab).equipos.map(function(e){return '<option>'+e+'</option>'}).join(""):"")+'</select></label>';
  h+='<button class="btn primary" type="submit">Registrar entrada</button></form>';
  h+='<h3>Mi registro de uso</h3>';
  h+=u.usos.length?'<div class="list">'+u.usos.map(function(x){return '<div class="item"><div class="row between"><span class="title">'+esc(x.equipo)+'</span>'+(x.salida?'<span class="chip gray">Salida registrada</span>':'<span class="chip ok">Dentro</span>')+'</div><div class="small muted">'+esc(x.folio)+' · Entrada '+dmy(x.entrada)+' '+hm(x.entrada)+(x.salida?' · Salida '+hm(x.salida):'')+'</div>'+(x.salida?'':'<button class="btn small" data-act="salida" data-id="'+esc(x.id)+'">Registrar salida</button>')+'</div>'}).join("")+'</div>':empty("mon","Todavía no registras entradas","Cuando uses un laboratorio, aparecerá aquí.");
  return h;
 },
 fallas:async function(){
  if(S.user.rol==="responsable")return viewFallasAdmin();
  var r=await api("misFallas");
  if(!r.ok)return errBox(r);
  var h='<h2>Reportar una falla</h2><p class="muted">Avisa de una computadora descompuesta. Recibirás un folio para darle seguimiento.</p>'+flashHtml();
  h+='<form id="ffalla" class="card" novalidate><label>Laboratorio<select name="lab" id="fl" data-act="flsel">'+labOptions(S.fLab,"Elige un laboratorio")+'</select></label>';
  h+='<label>Equipo<select name="equipo" id="fe"><option value="">Elige el equipo</option>'+(S.fLab?lab(S.fLab).equipos.map(function(e){return '<option>'+e+'</option>'}).join(""):"")+'</select></label>';
  h+='<label>¿Qué pasó?<textarea name="desc" id="fd" maxlength="200" placeholder="Ejemplo: no enciende"></textarea></label><button class="btn primary" type="submit">Enviar reporte</button></form>';
  h+='<h3>Mis reportes</h3>'+(r.fallas.length?'<div class="list">'+r.fallas.map(function(f){return fallaCard(f,false)}).join("")+'</div>':empty("alert","Todavía no has reportado fallas"));
  return h;
 },
 panel:async function(){
  if(!S.pLab)S.pLab=S.labs[0].id;if(!S.pDate)S.pDate=today();
  var r=await api("panel",{lab:S.pLab,fecha:S.pDate});
  if(!r.ok)return errBox(r);
  var h=hola()+'<h2>Panel de laboratorios</h2><p class="muted">Reservas registradas y espacios libres.</p>'+flashHtml();
  h+='<div class="grid2"><label>Laboratorio<select id="pl" data-act="pfilter">'+labOptions(S.pLab)+'</select></label><label>Fecha<input type="date" id="pd" value="'+S.pDate+'" data-act="pfilter"></label></div>'+fechaLbl(S.pDate);
  h+='<div class="row"><span class="chip ok">'+r.horasLibres+' h libres</span><span class="chip blue">'+r.reservas+(r.reservas===1?' reserva':' reservas')+'</span><span class="chip gray">Capacidad '+r.capacidad+'</span></div>';
  h+='<div class="list">'+r.segmentos.map(function(b){
    var t='<b>'+hm(b.ini)+' – '+hm(b.fin)+'</b>';
    if(b.libre)return '<div class="seg libre'+(b.pasado?' past':'')+'"><div>'+t+'<div class="small muted">'+(b.pasado?'Ya pasó':'Libre · '+durLabel(Math.round(b.horas*60)))+'</div></div>'+(b.pasado?'':chip("Libre"))+'</div>';
    var x=b.reserva;
    return '<div class="seg res'+(x.estado==="Usada"?' used':'')+(b.pasado?' past':'')+'"><div class="row between"><span>'+t+'</span>'+chip(x.estado)+'</div><div>'+esc(x.usuario)+' <span class="muted">('+esc(ROLES[x.rol]||x.rol)+')</span></div><div class="small muted">'+esc(x.folio)+' · '+esc(x.motivo)+' · '+x.personas+' personas'+(x.entradas?' · '+x.entradas+(x.entradas===1?' entrada registrada':' entradas registradas'):'')+'</div>'+(x.puedeCambiar?'<div class="row"><button class="btn small danger" data-act="cancel" data-f="'+x.folio+'" data-t="'+esc(x.folio+' · '+x.labNombre+' · '+dmy(x.inicio)+' · '+hm(x.inicio)+' a '+hm(x.fin))+'">Cancelar reserva</button></div>':'')+'</div>';
  }).join("")+'</div>';
  return h;
 },
 reservas:async function(){
  var r=await api("reservasLista",{lab:S.lLab,fecha:S.lDate});
  if(!r.ok)return errBox(r);
  var h='<h2>Reservas registradas</h2><p class="muted">Todas las reservas de los laboratorios.</p>'+flashHtml();
  h+='<div class="grid2"><label>Laboratorio<select id="ll" data-act="lfilter">'+labOptions(S.lLab,"",true)+'</select></label><label>Fecha<span class="hint">Vacía = todas</span><input type="date" id="ld" value="'+S.lDate+'" data-act="lfilter"></label></div>';
  h+=r.reservas.length?'<div class="list">'+r.reservas.map(function(x){return resCard(x,"all")}).join("")+'</div>':empty("list","No hay reservas con ese filtro");
  return h;
 },
 reporte:async function(){
  var r=await api("reporte",{periodo:S.rPer,lab:S.rLab});
  if(!r.ok)return errBox(r);
  var p=r.reporte;
  var h=(S.user.rol==="jefe"?hola():'')+'<h2>Reporte de uso y fallas</h2><p class="muted">'+esc(p.etiqueta.charAt(0).toUpperCase()+p.etiqueta.slice(1))+' · se calcula con las reservas y reportes registrados.</p>'+flashHtml();
  h+='<div class="grid2"><label>Periodo<select id="rp" data-act="rfilter"><option value="hoy"'+(S.rPer==="hoy"?" selected":"")+'>Hoy</option><option value="7dias"'+(S.rPer==="7dias"?" selected":"")+'>Últimos 7 días</option><option value="mes"'+(S.rPer==="mes"?" selected":"")+'>Este mes</option></select></label><label>Laboratorio<select id="rl2" data-act="rfilter">'+labOptions(S.rLab,"",true)+'</select></label></div>';
  h+='<div class="kpis"><div class="kpi k1"><b>'+p.reservas+'</b><span>Reservas</span></div><div class="kpi k2"><b>'+p.horasUsadas+'</b><span>Horas de laboratorio usadas</span></div><div class="kpi k3"><b>'+p.noUsadas+'</b><span>Reservas no usadas</span></div><div class="kpi k4"><b>'+p.fallasAbiertas+' · '+p.fallasRevision+' · '+p.fallasResueltas+'</b><span>Fallas: abiertas · en revisión · resueltas</span></div></div>';
  var mx=Math.max.apply(null,p.porLab.map(function(x){return x.horas}).concat([1]));
  h+='<div class="card"><h3>Horas usadas por laboratorio</h3>'+p.porLab.map(function(x){return '<div><div class="row between small"><span>'+esc(x.nombre)+'</span><b>'+x.horas+' h</b></div><div class="bar" role="img" aria-label="'+esc(x.nombre)+': '+x.horas+' horas"><i style="width:'+(x.horas/mx*100)+'%"></i></div></div>'}).join("")+'</div>';
  if(S.user.rol==="responsable")h+='<form id="fsend" class="card hl" novalidate><h3>Enviar al jefe del Centro de Cómputo</h3><p class="small">Se envía por correo este mismo reporte ('+esc(p.etiqueta)+', '+esc(p.labNombre)+').</p><label>Comentario <span class="hint">Opcional</span><textarea name="nota" maxlength="500" placeholder="Ejemplo: se necesita revisar el equipo L1-PC07"></textarea></label><button class="btn primary" type="submit">Enviar reporte por correo</button></form>';
  return h;
 }
};
function resCard(r,mode){
  var t=esc(r.folio+' · '+r.labNombre+' · '+dmy(r.inicio)+' · '+hm(r.inicio)+' a '+hm(r.fin));
  var h='<div class="item"><div class="row between"><span class="title">'+esc(r.folio)+' · '+esc(r.labNombre)+'</span>'+chip(r.estado)+'</div>';
  h+='<div class="when"><b>'+hm(r.inicio)+' a '+hm(r.fin)+'</b> · '+dmy(r.inicio)+'</div><div class="small muted">'+esc(r.motivo)+' · '+r.personas+' personas'+(mode==="all"?' · '+esc(r.usuario):'')+'</div>';
  if(r.estado==="Reservada"){
    if(mode==="mine"&&r.puedeCambiar)h+='<div class="row"><button class="btn small" data-act="edit" data-f="'+r.folio+'">Modificar</button><button class="btn small danger" data-act="cancel" data-f="'+r.folio+'" data-t="'+t+'">Cancelar</button></div>';
    else if(mode==="mine")h+='<div class="small muted">Ya no se puede cambiar ni cancelar (faltan menos de '+S.params.anticipacion_h+' horas).</div>';
    else if(mode==="all")h+='<div class="row"><button class="btn small danger" data-act="cancel" data-f="'+r.folio+'" data-t="'+t+'">Cancelar reserva</button></div>';
  }
  return h+'</div>';
}
function fallaCard(f,admin){
  return '<div class="item"><div class="row between"><span class="title">'+esc(f.folio)+' · '+esc(f.equipo)+'</span>'+chip(f.estado)+'</div><div>'+esc(f.desc)+'</div><div class="small muted">'+dmy(f.fecha)+' '+hm(f.fecha)+(f.accion?' · Acción: '+esc(f.accion):'')+(admin&&f.reporto?' · Reportó: '+esc(f.reporto):'')+'</div>'+(admin?'<button class="btn small" data-act="fopen" data-f="'+f.folio+'">Atender</button>':'')+'</div>';
}
async function viewFallasAdmin(){
  var r=await api("fallas",{estado:S.fFilter});
  if(!r.ok)return errBox(r);
  S.cache.fallas=r.fallas;
  var h='<h2>Atender fallas</h2><p class="muted">Cambia el estado y registra la acción realizada. Quien reportó recibe un correo.</p>'+flashHtml();
  h+='<label>Mostrar<select id="ff2" data-act="ffilter">'+["todas","Abierto","En revisión","Resuelto"].map(function(x){return '<option value="'+x+'"'+(x===S.fFilter?" selected":"")+'>'+(x==="todas"?"Todas":x)+'</option>'}).join("")+'</select></label>';
  h+=r.fallas.length?'<div class="list">'+r.fallas.map(function(f){return fallaCard(f,true)}).join("")+'</div>':empty("alert","No hay fallas con ese filtro");
  return h;
}

/* ---------- ventanas (hojas) ---------- */
function editForm(){
  var x=S.edit,starts=startList(x.date,x.oc);
  if(!starts.some(function(m){return mmStr(x.date,m)===x.ini}))x.ini="";
  var durs=durList(x.date,x.oc,x.ini?toMin(x.ini):null);
  if(!durs.some(function(d){return d/60===+x.dur}))x.dur=durs.length?durs[0]/60:1;
  return '<div class="overlay" data-act="closesheet"><form class="sheet" id="fedit" novalidate role="dialog" aria-label="Modificar reserva"><h3>Modificar '+esc(x.folio)+'</h3>'+(S.sheetMsg?'<div class="msg err" role="alert">'+esc(S.sheetMsg)+'</div>':'')+'<label>Fecha<input type="date" name="date" id="ed" min="'+today()+'" value="'+x.date+'" data-act="edate"></label>'+fechaLbl(x.date)+'<label>Hora de inicio<select name="ini" id="ei" data-act="edredraw"><option value="">'+(starts.length?'Elige la hora':'No hay horarios libres')+'</option>'+starts.map(function(m){var v=mmStr(x.date,m);return '<option value="'+v+'"'+(x.ini===v?" selected":"")+'>'+hm(v)+'</option>'}).join("")+'</select></label><div class="grid2"><label>Duración<select name="dur">'+durOptions(durs,x.dur)+'</select></label><label>Personas<input type="number" name="personas" min="1" value="'+esc(x.personas)+'"></label></div><div class="row"><button class="btn primary" type="submit">Guardar cambios</button><button class="btn" type="button" data-act="closesheet2">Cerrar</button></div></form></div>';
}
function renderModal(){
  var m=$("modal");
  if(S.conf){
    m.innerHTML='<div class="overlay" data-act="closesheet"><div class="sheet" role="alertdialog" aria-label="Confirmar cancelación"><h3>¿Cancelar esta reserva?</h3><p><b>'+esc(S.conf.t)+'</b></p><p class="small muted">El horario quedará libre y se avisará por correo a quien la hizo.</p><div class="row"><button class="btn danger" data-act="confirmcancel">Sí, cancelar reserva</button><button class="btn" data-act="closesheet2">No, volver</button></div></div></div>';
  }else if(S.edit){
    m.innerHTML=editForm();
  }else if(S.att){
    var f=S.att;
    m.innerHTML='<div class="overlay" data-act="closesheet"><form class="sheet" id="fatt" novalidate role="dialog" aria-label="Atender falla"><h3>'+esc(f.folio)+' · '+esc(f.equipo)+'</h3><p>'+esc(f.desc)+'</p>'+(S.sheetMsg?'<div class="msg err" role="alert">'+esc(S.sheetMsg)+'</div>':'')+'<label>Estado<select name="estado">'+["Abierto","En revisión","Resuelto"].map(function(e){return '<option'+(e===f.estado?' selected':'')+'>'+e+'</option>'}).join("")+'</select></label><label>Acción realizada<span class="hint">Obligatoria para marcarla como resuelta</span><textarea name="accion" maxlength="200">'+esc(f.accion)+'</textarea></label><div class="hist"><b>Historial</b>'+f.historial.map(function(h){return '<span>'+dmy(h.fecha)+' '+hm(h.fecha)+' · '+esc(h.estado)+(h.accion?' · '+esc(h.accion):'')+'</span>'}).join("")+'</div><div class="row"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" data-act="closesheet2">Cerrar</button></div></form></div>';
  }else m.innerHTML="";
}
function closeSheets(){S.edit=null;S.att=null;S.conf=null;S.sheetMsg=null;renderModal()}
async function loadEditOc(){var r=await api("horarios",{lab:S.edit.lab,fecha:S.edit.date,excluir:S.edit.folio});S.edit.oc=r.ok?r.ocupados:[]}
function readEdit(){var f=$("fedit");S.edit.date=f.date.value||S.edit.date;S.edit.ini=f.ini.value;S.edit.dur=f.dur.value;S.edit.personas=f.personas.value}

/* ---------- eventos ---------- */
function readRes(){var f=$("fres");return {lab:f.lab.value,date:f.date.value,ini:f.ini.value,dur:f.dur.value,motivo:f.motivo.value,personas:f.personas.value}}
document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-go],[data-act]");if(!t||S.busy)return;
  if(t.dataset.go){go(t.dataset.go);return}
  var a=t.dataset.act,r;
  if(a==="closesheet"){if(e.target===t)closeSheets();return}
  if(a==="closesheet2"){closeSheets();return}
  if(a==="salir"){await api("salir");S.token=null;store("bep-token",null);S.user=null;S.tab=null;S.login={correo:""};S.draft=null;S.entFolio="";S.hLab="";S.pLab="";draw();return}
  if(a==="pick"){S.draft={lab:S.hLab,date:S.hDate,ini:t.dataset.ini,dur:1,motivo:"",personas:""};go("reservar");return}
  if(a==="cancel"){S.conf={folio:t.dataset.f,t:t.dataset.t||t.dataset.f};renderModal();return}
  if(a==="confirmcancel"){
    var fo=S.conf.folio;S.conf=null;renderModal();
    r=await api("cancelar",{folio:fo});
    setFlash(r.ok?"ok":"err",r.ok?'<b>Reserva '+esc(r.folio)+' cancelada.</b><span>El horario quedó libre. '+mailLine(r.correo)+'</span>':'<b>No se pudo cancelar.</b><span>'+esc(r.msg)+'</span>');draw();return}
  if(a==="edit"){r=await api("misReservas");var x=(r.reservas||[]).filter(function(y){return y.folio===t.dataset.f})[0];
    if(x&&x.puedeCambiar){S.edit={folio:x.folio,lab:x.lab,date:x.inicio.slice(0,10),ini:x.inicio,dur:(toMin(x.fin)-toMin(x.inicio))/60,personas:x.personas,oc:[]};S.sheetMsg=null;await loadEditOc();renderModal()}
    else{setFlash("err","<b>No se pudo modificar.</b><span>Esta reserva ya no se puede cambiar.</span>");draw()}return}
  if(a==="salida"){r=await api("salida",{id:t.dataset.id});setFlash(r.ok?"ok":"err",r.ok?'<b>Salida registrada</b><span>'+esc(r.equipo)+' a las '+hm(r.salida)+'.</span>':'<b>No se pudo registrar.</b><span>'+esc(r.msg)+'</span>');draw();return}
  if(a==="fopen"){var ff=(S.cache.fallas||[]).filter(function(y){return y.folio===t.dataset.f})[0];if(ff){S.att=ff;S.sheetMsg=null;renderModal()}return}
});
document.addEventListener("change",async function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==="showpw"){$("lp").type=t.checked?"text":"password";return}
  if(S.busy)return;
  if(a==="hfilter"){S.hLab=$("hl").value;S.hDate=$("hd").value||today();draw(true)}
  else if(a==="pfilter"){S.pLab=$("pl").value;S.pDate=$("pd").value||today();draw(true)}
  else if(a==="lfilter"){S.lLab=$("ll").value;S.lDate=$("ld").value;draw(true)}
  else if(a==="rfilter"){S.rPer=$("rp").value;S.rLab=$("rl2").value;draw(true)}
  else if(a==="redraw"){S.draft=readRes();draw(true)}
  else if(a==="entsel"){S.entFolio=t.value;draw(true)}
  else if(a==="flsel"){S.fLab=t.value;draw(true)}
  else if(a==="ffilter"){S.fFilter=t.value;draw(true)}
  else if(a==="edate"){readEdit();S.edit.ini="";await loadEditOc();renderModal()}
  else if(a==="edredraw"){readEdit();renderModal()}
});
document.addEventListener("submit",async function(e){
  e.preventDefault();if(S.busy)return;
  var f=e.target,r;
  if(f.id==="flogin"){
    S.login.correo=f.correo.value.trim();
    r=await api("iniciarSesion",{correo:S.login.correo,clave:f.clave.value});
    if(!r.ok){setFlash("err","<b>No se pudo entrar.</b><span>"+esc(r.msg)+"</span>");draw();return}
    S.token=r.token;store("bep-token",r.token);S.login={correo:""};await start();return}
  if(f.id==="fres"){
    var d=readRes();S.draft=d;
    r=await api("reservar",{lab:d.lab,inicio:d.ini,dur:d.dur,motivo:d.motivo,personas:d.personas});
    if(!r.ok){setFlash("err","<b>No se pudo reservar.</b><span>"+esc(r.msg)+"</span>");draw();return}
    S.draft=null;setFlash("ok","<b>Reserva confirmada · folio "+esc(r.folio)+"</b><span>"+esc(r.labNombre)+" · "+dmy(r.inicio)+" · "+hm(r.inicio)+" a "+hm(r.fin)+". "+mailLine(r.correo)+"</span>");go("mis",true);return}
  if(f.id==="fedit"){
    readEdit();var x=S.edit;
    r=await api("modificar",{folio:x.folio,inicio:x.ini,dur:x.dur,personas:x.personas});
    if(!r.ok){S.sheetMsg=r.msg;renderModal();return}
    S.edit=null;S.sheetMsg=null;setFlash("ok","<b>Reserva "+esc(r.folio)+" actualizada</b><span>"+dmy(r.inicio)+" · "+hm(r.inicio)+" a "+hm(r.fin)+". "+mailLine(r.correo)+"</span>");draw();return}
  if(f.id==="fent"){
    r=await api("entrada",{folio:f.folio.value,equipo:f.equipo.value});
    setFlash(r.ok?"ok":"err",r.ok?"<b>Entrada registrada</b><span>"+esc(r.equipo)+". No olvides registrar tu salida.</span>":"<b>Entrada rechazada.</b><span>"+esc(r.msg)+"</span>");draw();return}
  if(f.id==="ffalla"){
    S.fLab=f.lab.value;
    r=await api("reportarFalla",{lab:f.lab.value,equipo:f.equipo.value,desc:f.desc.value});
    if(r.ok){S.fLab="";setFlash("ok","<b>Reporte enviado · folio "+esc(r.folio)+"</b><span>Estado: Abierto. "+(r.avisados.length?"Avisamos por correo al responsable de laboratorio.":"")+"</span>")}
    else setFlash("err","<b>No se pudo enviar el reporte.</b><span>"+esc(r.msg)+"</span>");
    draw();return}
  if(f.id==="fatt"){
    var fa=S.att;
    r=await api("atenderFalla",{folio:fa.folio,estado:f.estado.value,accion:f.accion.value});
    if(!r.ok){S.att.estado=f.estado.value;S.att.accion=f.accion.value;S.sheetMsg=r.msg;renderModal();return}
    S.att=null;S.sheetMsg=null;setFlash("ok","<b>Falla "+esc(r.folio)+" actualizada: "+esc(r.estado)+"</b><span>"+mailLine(r.correo)+"</span>");draw();return}
  if(f.id==="fsend"){
    r=await api("enviarReporte",{periodo:S.rPer,lab:S.rLab,nota:f.nota.value});
    setFlash(r.ok?"ok":"err",r.ok?"<b>Reporte enviado</b><span>Se envió por correo a "+esc(r.para.join(", "))+".</span>":"<b>No se pudo enviar.</b><span>"+esc(r.msg)+"</span>");draw();return}
});

/* ---------- inicio ---------- */
async function start(){
  var r=await api("sesion");
  if(!r.ok){if(!r.sesion){S.token=null;store("bep-token",null);setFlash("err","<b>No se pudo entrar.</b><span>"+esc(r.msg)+"</span>")}return draw()}
  S.user=r.usuario;S.labs=r.labs;S.params=r.params;S.tab=null;draw();
}
S.token=load("bep-token");
if(S.token)start();else draw();
})();

</script>
</body></html>
